name: CI

# CI/CD via the shared phylecorp library (phylecorp/cicd).
#   - pull_request : lint + test + build (validation only).
#   - push to main : lint + test -> autoversion -> uv build -> git tag -> GitHub release.
# The git tag is the version surface for git-dep consumers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: phylecorp/cicd/.github/workflows/python-lib.yml@v1
    permissions:
      contents: write
    with:
      python-version: "3.12"
      run-lint: true
      lint-command: "uv run ruff check src/ tests/"
      test-command: "uv run pytest"
    secrets: inherit
